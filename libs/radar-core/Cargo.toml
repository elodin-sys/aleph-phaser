[package]
name = "radar-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Shared radar backend library for PyO3 bridge, types, and wire protocol"

[dependencies]
# Python interop for radar backend
pyo3 = { workspace = true }

# Arrays and math
ndarray = { workspace = true }
bytemuck = "1.14"

# Error handling
thiserror = { workspace = true }

# Serialization (for config)
serde = { workspace = true }
serde_json = { workspace = true }

# Logging (for GPU status at init)
tracing = "0.1"

[build-dependencies]
pyo3-build-config = { workspace = true }

[lib]
name = "radar_core"
path = "src/lib.rs"
