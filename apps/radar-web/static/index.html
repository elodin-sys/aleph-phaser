<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Radar Web</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #1a1a2e;
            color: #eee;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
        }
        #container {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        #header {
            padding: 8px 16px;
            background: #16213e;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
        }
        #status {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        #status-indicator {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #ef4444;
        }
        #status-indicator.connected {
            background: #22c55e;
        }
        #canvas-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        canvas {
            max-width: 100%;
            max-height: 100%;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
        }
        #loading.hidden {
            display: none;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #16213e;
            border-top-color: #0f4c75;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="container">
        <header id="header">
            <span>Radar Web Visualization</span>
            <div id="status">
                <div id="status-indicator"></div>
                <span id="status-text">Disconnected</span>
                <span id="fps-counter">0 FPS</span>
            </div>
        </header>
        <div id="canvas-container">
            <canvas id="radar-canvas"></canvas>
        </div>
        <div id="loading">
            <div class="spinner"></div>
            <p>Loading WebGPU client...</p>
            <p id="loading-status"></p>
        </div>
    </div>
    <script type="module">
        const loadingStatus = document.getElementById('loading-status');
        const loading = document.getElementById('loading');
        
        // Check for WebGPU support
        if (!navigator.gpu) {
            loadingStatus.textContent = 'WebGPU is not supported in this browser.';
            loadingStatus.style.color = '#ef4444';
        } else {
            loadingStatus.textContent = 'Initializing...';
            
            // Import and initialize WASM module
            try {
                const module = await import('./radar_web_client.js');
                await module.default();
                loading.classList.add('hidden');
            } catch (e) {
                console.error('Failed to load WASM module:', e);
                loadingStatus.textContent = `Failed to load: ${e.message}`;
                loadingStatus.style.color = '#ef4444';
            }
        }
    </script>
</body>
</html>
