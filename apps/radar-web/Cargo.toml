[package]
name = "radar-web"
version = "0.1.0"
edition = "2021"
description = "WebGPU radar visualization web server"
license = "MIT"

[[bin]]
name = "radar-web"
path = "src/main.rs"

[dependencies]
# Radar core library
radar-core = { path = "../../libs/radar-core" }

# Web framework
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["fs", "cors"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Utilities
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
anyhow = "1"
